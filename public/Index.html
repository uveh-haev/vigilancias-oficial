<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletín UVEH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..800;1,500..800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style id="uveh-css">
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F4F5F8; --ink:#161924; --ink-2:#454C5E; --line:#DCE0EA;
  --wine:#7B1E3E; --wine-ink:#FFFFFF; --wine-soft:#F6E9EE;
  --act:#0E7C86; --act-hover:#0B656D; --act-ink:#FFFFFF; --act-soft:#E4F3F4;
  --arch-bg:#EEE9FA; --arch-hover:#E2DAF6; --arch-line:#6A4FB3; --arch-ink:#2E2357; --arch-meta:#503F8C;
  --crit:#C62B35; --crit-soft:#FDECEC; --warn:#9E5A07; --warn-soft:#FFF3E0; --info:#28559A; --info-soft:#E8EFFA; --ok:#156943; --ok-soft:#E6F4EC; --mut:#50586B; --mut-soft:#E9ECF2;
  --shadow:0 1px 3px rgba(20,25,45,.06); --shadow-float:0 6px 18px rgba(20,25,45,.12);
  --display:"Figtree","Segoe UI",Roboto,Arial,sans-serif;
  --body:"Figtree","Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,Consolas,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;--bg:#101218;--surface:#1A1D26;--surface-2:#232734;--ink:#F0F2F7;--ink-2:#B8C0D2;--line:#2E3445;
  --wine:#DF829C;--wine-ink:#1B0E14;--wine-soft:#3A2030;--act:#3CC1CD;--act-hover:#57CED9;--act-ink:#072024;--act-soft:#153136;
  --arch-bg:#262038;--arch-hover:#312949;--arch-line:#9E86E8;--arch-ink:#ECE8FA;--arch-meta:#C4B6F0;
  --crit:#FF857D;--crit-soft:#3F1E22;--warn:#F4B856;--warn-soft:#3A2C12;--info:#93B8EA;--info-soft:#1B2838;--ok:#72D19A;--ok-soft:#17301F;--mut:#B0B8CA;--mut-soft:#2A2F3D;--shadow:none;--shadow-float:0 6px 20px rgba(0,0,0,.48);}}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:20px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,select,input,textarea{font:inherit;color:inherit}
button,select,input,summary,a{touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wine);outline-offset:3px;box-shadow:0 0 0 2px var(--surface)}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mast{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);margin-inline:-20px;padding:14px 20px}
.mast-in{max-width:1600px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:56px;height:56px;border-radius:50%;background:#fff;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line)}
.mast h1{font-size:20px;font-weight:750;line-height:1.15}
.mast .fecha{font-size:14px;color:var(--ink-2);margin-top:1px}
.mast .fecha::first-letter{text-transform:uppercase}
.estado{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:650;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.estado.viejo{background:var(--warn-soft);color:var(--warn)}
.mast-btns{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 14px;font-weight:650;font-size:14.5px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.hbtn:hover{border-color:var(--wine)}
.hbtn.solid{background:var(--wine);color:var(--wine-ink);border-color:var(--wine)}
#file{display:none}
body.dragging .mast{outline:4px dashed var(--wine);outline-offset:-8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:650;min-height:46px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--wine)}
.btn.primary{background:var(--wine);color:var(--wine-ink);border-color:var(--wine)}
.btn:disabled{opacity:.6;cursor:wait}
.banner{border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line)}
.banner .txt{flex:1 1 280px}.banner.warn .txt{flex-basis:200px}
.banner.warn{padding:6px 12px;border-radius:10px;font-size:13px;line-height:1.35;background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.banner.err{background:var(--crit-soft);border-color:var(--crit)}
.banner.preview{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 40%,transparent)}
.ayuda{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:14px}
.ayuda h2{font-size:22px}
.ayuda ol{margin:0;padding-left:22px;display:grid;gap:8px}
.ayuda li b{color:var(--wine)}
.leyenda{display:flex;flex-wrap:wrap;gap:8px}
/* Filtro de servicio: botones siempre visibles, en una fila */
.servicio{display:none}
.panel-svc{background:none;border:0;padding:0;display:block}
.panel-svc .q{display:none}
.panel-svc .grid{display:flex;flex-wrap:wrap;gap:8px}
.svc-btn{display:inline-flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14.5px;min-height:44px}
.svc-btn:hover{border-color:var(--wine)}
.svc-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.num{font-family:var(--body);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;min-width:24px;text-align:center;border-radius:999px;padding:1px 8px;background:var(--mut-soft);color:var(--ink-2)}
.num.hot{background:var(--crit);color:#fff}
.svc-btn[aria-pressed="true"] .num{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}
.svc-btn[aria-pressed="true"] .num.hot{background:var(--crit);color:#fff}
/* Pestañas: texto con subrayado, se deslizan de lado si no caben */
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:0}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--ink);text-align:left;white-space:nowrap}
.tab:hover{border-color:var(--wine)}
.tab .t{order:1;font-weight:600;font-size:14.5px;line-height:1.2}
.tab .n{order:2;font-family:var(--body);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;line-height:1.5;border-radius:999px;padding:1px 8px;min-width:24px;text-align:center;background:var(--mut-soft);color:var(--ink-2)}
.tab.t-crit .n{background:var(--crit-soft);color:var(--crit)} .tab.t-warn .n{background:var(--warn-soft);color:var(--warn)} .tab.t-mut .n{background:var(--mut-soft);color:var(--ink-2)} .tab.t-ok .n{background:var(--ok-soft);color:var(--ok)} .tab.t-info .n{background:var(--info-soft);color:var(--info)} .tab.t-wine .n{background:var(--wine-soft);color:var(--wine)}
.tab[aria-selected="true"]{background:var(--wine);color:var(--wine-ink);border-color:var(--wine)}
.tab[aria-selected="true"] .n{background:color-mix(in srgb,var(--wine-ink) 22%,transparent);color:var(--wine-ink)}
.resumen{font-size:18px;line-height:1.4}
.resumen b{color:var(--crit)}
.buscar{position:relative;display:flex;gap:8px;align-items:center}
.buscar input{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 48px 10px 14px;min-height:52px;font-size:17px;min-width:0}
.buscar input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.q-clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.q-clear:hover{background:var(--surface-2);color:var(--ink)}
.grp{display:grid;gap:12px}
.grp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:0;background:none;padding:8px 4px;min-height:48px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.grp-h h3{font-size:21px;font-weight:750;flex:1 1 auto}
.grp-h .flecha{font-size:16px;color:var(--ink-2);width:20px}
.sub-h{font-weight:700;font-size:15px;color:var(--ink-2);display:flex;gap:8px;align-items:center;margin-top:4px}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start}
@media (max-width:420px){.lista{grid-template-columns:1fr}}
/* Ficha de paciente */
.pac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 260px}
.pac::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--mut)}
.pac.p0::before{background:var(--crit)} .pac.p1::before{background:var(--warn)} .pac.p2::before{background:var(--info)}
.who{display:flex;gap:13px;align-items:flex-start;padding:16px 16px 6px 18px}
.cama{font-family:var(--body);font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:6px 10px;white-space:nowrap;text-align:center;line-height:1.25;min-width:60px}
.cama small{display:block;font-size:10.5px;letter-spacing:0;color:var(--ink-2);font-weight:650}
.nm{font-weight:750;font-size:17.5px;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.meta{font-size:14px;color:var(--ink-2);margin-top:2px}
.eventos{padding:8px 16px 12px 18px;display:flex;flex-direction:column;gap:0}
.evento{border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 0 0;margin-top:14px;display:grid;gap:10px;background:none}
.evento:first-child{border-top:0;margin-top:0;padding-top:6px}
.evento.nuevo{background:var(--wine-soft);border-radius:12px;padding:12px;border-top:0}
.evento.done{opacity:.65}
.evento .prio{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0;padding:0;background:none}
.evento .prio>span:first-child{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--mut-soft);color:var(--mut)}
.evento.p0 .prio>span:first-child{background:var(--crit-soft);color:var(--crit)} .evento.p1 .prio>span:first-child{background:var(--warn-soft);color:var(--warn)} .evento.p2 .prio>span:first-child{background:var(--info-soft);color:var(--info)}
.prio .extra{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.q{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:2px}
.hacer{background:var(--surface-2);border-left:3px solid var(--act);border-radius:12px;padding:10px 12px}
.hacer .q{color:var(--ink-2)}
.hacer>div:not(.q){font-size:14.5px;line-height:1.45}
.micro{background:none;border:0;padding:0}
.micro-chips{display:flex;flex-direction:column;gap:8px;margin-top:3px}
.chip-micro{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border-radius:12px;padding:10px 12px;font-style:italic;font-weight:750;font-size:16.5px;line-height:1.2;overflow-wrap:anywhere}
.chip-micro .cm-top{display:flex;flex-direction:column;gap:2px}
.chip-micro .st{font-style:normal;font-weight:700;font-size:12.5px;letter-spacing:0}
.chip-micro .cm-muestra{font-style:normal;font-weight:550;font-size:14px;line-height:1.3;color:var(--ink)}
.chip-micro.cap{background:var(--ok-soft);color:var(--ok)}
.chip-micro.pend{background:var(--crit-soft);color:var(--crit)}
.atb{background:var(--surface-2);border:0;border-radius:12px;padding:10px 12px}
.atbtext{font-size:12.5px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:12px;font-weight:650;border-radius:7px;padding:3px 9px;white-space:nowrap}
.tag.new{background:var(--wine);color:var(--wine-ink)}
.tag.lab{background:var(--info-soft);color:var(--info)}
.tag.norh{background:var(--crit-soft);color:var(--crit)}
.tag.pend{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.prog{background:var(--mut-soft);color:var(--ink)}
details.mas>summary{cursor:pointer;font-weight:650;font-size:14px;color:var(--wine);list-style:none;min-height:44px;display:flex;align-items:center}
details.mas>summary::-webkit-details-marker{display:none}
details.mas>summary::before{content:"Ver más datos ▾"}
details.mas[open]>summary::before{content:"Ocultar datos ▴"}
.datos{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:6px 0 0}
.datos dt{color:var(--ink-2)} .datos dd{margin:0;overflow-wrap:anywhere}
.rv-tira{background:var(--surface);border:2px solid var(--act);border-radius:12px;overflow:hidden}
.rv-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;min-height:48px;background:transparent;border:0;color:var(--act);font-weight:800;font-size:15px;text-align:left}
.rv-list{border-top:1px solid var(--line);max-height:360px;overflow:auto;padding:4px 10px 8px}
.rv-row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.rv-l{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;min-width:0}
.rv-cama{font-weight:800;background:var(--surface-2);border-radius:6px;padding:2px 8px;font-size:13px}
.rv-nm{font-weight:800}.rv-sv,.rv-by{color:var(--ink-2);font-size:13px}
.rv-b{display:flex;gap:8px;flex-wrap:wrap}
.rv-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;min-height:44px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.rv-btn:hover{border-color:var(--act)}
.rv-ficha{padding:8px 0 4px}
.lote{display:grid;gap:10px}
.lote-help{font-size:14.5px;color:var(--ink-2);margin:0}
.lote-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lote-sum{font-weight:800;font-size:15px}
.lote-row{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.lote-row img{width:96px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.img-backdrop{position:fixed;inset:0;background:rgba(10,12,18,.68);z-index:49;cursor:zoom-out}
.lote-row img.big{position:fixed;inset:5vh 0 auto 0;margin:auto;width:min(92vw,720px);max-height:90vh;object-fit:contain;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.5);cursor:zoom-out}
.lote-row select{width:100%;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:14.5px;background:var(--surface);color:var(--ink)}
.lote-ocr{font-size:13px;color:var(--ink-2);margin-bottom:5px;overflow-wrap:anywhere}
.lote-st{display:inline-block;font-size:12.5px;font-weight:800;border-radius:99px;padding:2px 9px;margin-top:5px}
.lote-st.ok{background:var(--ok-soft);color:var(--ok)}.lote-st.rev{background:var(--warn-soft);color:var(--warn)}.lote-st.om{background:var(--mut-soft);color:var(--mut)}
.lote-prog{height:8px;border-radius:99px;background:var(--mut-soft);overflow:hidden}.lote-prog>i{display:block;height:100%;background:var(--act);width:0}
.obs{font-size:13.5px;color:var(--ink-2);max-height:110px;overflow-y:auto;scrollbar-width:thin;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-top:8px}
.revisar-grp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
@media (max-width:400px){.revisar-grp{grid-template-columns:1fr}}
.revisar{margin:0;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;min-height:48px;padding:8px 10px;font-weight:800;font-size:15.5px;line-height:1.15;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.revisar:hover{border-color:var(--wine)}
.revisar-grp .revisar:first-child{background:var(--act);color:var(--act-ink);border-color:var(--act)}
.revisar-grp .revisar:first-child:hover{background:var(--act-hover);border-color:var(--act-hover)}
.revisar-grp .revisar.siniaas{background:var(--surface);color:var(--ink-2);border-color:var(--line);font-size:14.5px}
.revfin{margin:2px 14px 14px}.revfin>.revisar{width:100%;min-height:48px;font-size:15px;background:var(--ok-soft);color:var(--ok);border-color:transparent}.revfin>.revisar.siniaas{background:var(--wine-soft);color:var(--wine)}
.evento>.revisar{margin-top:2px;align-self:stretch;min-height:48px;font-size:15px;background:var(--ok-soft);color:var(--ok);border-color:transparent}
.evento>.revisar.siniaas{background:var(--wine-soft);color:var(--wine)}
.crit-box{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 8px}
.crit-box label{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer;min-height:44px;padding:6px 8px;border-radius:8px}
.crit-box label:not(.crit-sel):hover{background:var(--surface)}
.crit-box label.crit-sel{flex-direction:column;align-items:stretch;gap:4px;cursor:default;padding:2px 0;min-height:0}
.crit-box input[type="checkbox"],.crit-box input[type="radio"]{width:22px;height:22px;min-width:22px;min-height:22px;margin:0;flex:none;accent-color:var(--act);cursor:pointer}
.crit-box select{width:100%;min-height:46px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;background:var(--surface);color:var(--ink)}
.crit-box .cumple{display:flex;gap:8px 14px;flex-wrap:wrap}
.crit-res{font-size:12.5px;color:var(--ink-2)}
.lnkline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.evento>.lnkline{border-top:1px solid var(--line);margin-top:2px;padding-top:4px}
.masbtn{background:none;border:0;font-weight:700;font-size:15.5px;color:var(--ink-2);padding:8px 6px;min-height:44px;border-radius:8px;display:inline-flex;align-items:center;gap:4px}
.masbtn:hover{color:var(--wine);background:var(--surface-2)}
.masbody{padding:2px 0 8px}
.pac>.masbody{padding:0 16px 16px 18px;border-top:1px solid var(--line);padding-top:12px}
.hechos{border-top:1px dashed var(--line);padding-top:10px}
.hechos>summary{cursor:pointer;font-weight:650;color:var(--ok);min-height:44px;display:flex;align-items:center}
.subrow{display:flex;flex-direction:column;gap:6px}
.subrow .q{margin:0}
.brotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.brote{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--warn);border-radius:16px;padding:14px 16px;display:grid;gap:8px;align-content:start;content-visibility:auto;contain-intrinsic-size:auto 260px}
.brote.ab{border-top-color:var(--crit)}
.brote h3{font-size:20px;font-style:italic}
.brote ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.brote li{display:flex;flex-direction:column;gap:0}
.fila-pac{display:flex;gap:10px;align-items:center;width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;margin:0;text-align:left;min-height:48px}
.fila-pac:hover{border-color:var(--line);background:var(--surface-2)}
.fila-pac .flecha{margin-left:auto;color:var(--ink-2);font-size:14px}
.brote-ficha{margin:8px 0 2px}
.explica{color:var(--ink-2);font-size:15px;max-width:75ch}
.progs{display:flex;flex-wrap:wrap;gap:8px}
.egr-wrap{display:flex;flex-direction:column;gap:6px}
.egr-tag{align-self:flex-start;background:var(--mut-soft);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.egr-tag.def{background:var(--crit-soft);color:var(--crit)}
.pbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14.5px;min-height:44px;display:inline-flex;gap:8px;align-items:center}
.pbtn:hover{border-color:var(--wine)}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pbtn[aria-pressed="true"] .num{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}
.fila{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start;content-visibility:auto;contain-intrinsic-size:auto 260px}
.fila .nm{font-size:16px}
.fila .r2{grid-column:1 / -1;font-size:14px;color:var(--ink-2)}
.vacio{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:36px 20px;text-align:center;color:var(--ink-2)}
.vacio h2{color:var(--ink);font-size:24px;margin-bottom:6px}
.nota{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--ink-2);font-size:15px}
.nota summary{cursor:pointer;font-weight:650;color:var(--wine);min-height:44px;display:flex;align-items:center}
.notaenf-bar{padding:0 16px 12px 18px}
.notaenf-bar .btn{width:100%;justify-content:center;border-color:var(--info);color:var(--info)}
.pac-nota{margin:0 16px 12px 18px;background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 40%,transparent);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:14.5px}
.pac-nota-box{width:100%;min-height:90px;font-size:14.5px;font-family:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink)}
.wa-box{width:100%;min-height:240px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:650;z-index:30;max-width:calc(100% - 32px);text-align:center}
.hbtn .badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;margin-left:8px;border-radius:999px;background:var(--wine);color:var(--wine-ink);font-size:12px;font-weight:700}
.notabox{margin:0 16px 14px 18px}
.notalink{background:none;border:0;color:var(--wine);font-weight:650;font-size:14px;padding:6px 4px;min-height:44px;display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:2px}
.notaform{display:grid;gap:8px;margin-top:6px;background:var(--surface-2);border-radius:12px;padding:10px}
.notaform textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);font-family:var(--body);font-size:15px;resize:vertical}
.notas-list{display:grid;gap:10px}
.archbox{margin:0;padding:10px 16px 14px 18px;border-top:1px solid var(--line)}
.arch-list{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.arch-item{display:flex;align-items:center;gap:10px;background:var(--arch-bg);border:0;border-left:5px solid var(--arch-line);border-radius:10px;padding:10px 12px;min-height:48px;color:var(--arch-ink);text-decoration:none;font-size:14px;font-weight:700}
.arch-item:hover{background:var(--arch-hover)}
.arch-ico{font-size:20px;line-height:1}
.arch-txt{flex:1;min-width:0;word-break:break-word}
.arch-ver{margin-left:auto;background:var(--arch-line);color:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.arch-meta{color:var(--arch-meta);font-weight:500;font-size:13px;display:block}
.archform{display:grid;gap:8px;margin-top:6px;background:var(--surface-2);border-radius:12px;padding:10px}
.archbox .notalink{text-decoration:none;color:var(--ink-2);font-size:16px;font-weight:700}
.archbox .notalink:hover{color:var(--wine)}
.nota-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.nota-item.aplicada{opacity:.65}
.nota-head{font-size:15px;font-weight:700}
.nota-txt{font-size:15px}
.nota-meta{font-size:13px;color:var(--ink-2)}
.nota-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nota-edit{width:100%;font:inherit;font-size:15px;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
footer{font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px}
/* ===== Navegación simplificada (letra grande, un paso a la vez) ===== */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.nv-side{position:sticky;top:12px}
.nv-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.nv-inicio{display:flex;flex-direction:column;gap:12px}
.nv-lista{display:flex;flex-direction:column;gap:16px}
.nv-lbl{font-size:15px;font-weight:800;color:var(--ink-2);letter-spacing:.03em;text-transform:uppercase;margin:0}
.app .nv-m{display:none}
.nv-svc{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:0 14px;min-height:54px;margin:0 0 8px;font-size:17px;font-weight:800;text-align:left}
.nv-svc:hover{border-color:var(--wine)}
.nv-svc[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nv-n{min-width:40px;height:36px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;background:var(--mut-soft);color:var(--ink);padding:0 12px;font-variant-numeric:tabular-nums}
.nv-n.r{background:var(--crit);color:#fff}.nv-n.w{background:var(--warn-soft);color:var(--warn)}.nv-n.g{background:var(--ok-soft);color:var(--ok)}
.nv-svc[aria-pressed="true"] .nv-n:not(.r){background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}
.nv-lists{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.nv-opt{display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 10px;min-height:72px;text-align:left}
.nv-opt:hover{border-color:var(--wine)}
.nv-opt.main{border-color:var(--wine);background:var(--wine-soft)}
.nv-opt.dash{border-style:dashed}
.nv-opt .ic{font-size:22px;flex:none}
.nv-opt .nv-n{min-width:30px;height:28px;font-size:15px;padding:0 8px}
.nv-opt .tx{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.15}
.nv-opt .tx small{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-top:3px}
.nv-chev{font-size:22px;color:var(--ink-2)}
.nv-otras{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;background:var(--surface-2);border-radius:16px;padding:12px}
.nv-orow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;min-height:56px;padding:0 16px;font-size:18px;font-weight:700;text-align:left}
.nv-orow:hover{border-color:var(--wine)}.nv-orow.sel{border-color:var(--wine);background:var(--wine-soft)}
.subrow{display:block}
.nv-area{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:17px;font-weight:700}
.nv-area select{min-height:54px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:18px;font-weight:700;padding:0 14px;min-width:260px;max-width:100%}
.nv-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 10px}
.nv-back{border:2px solid var(--ink);border-radius:12px;padding:8px 14px;min-height:46px;font-weight:800;font-size:17px;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;flex:none}
.nv-ti{font-size:18.5px;font-weight:800;line-height:1.15;flex:1;min-width:0}.nv-ti small{display:block;font-size:14px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv-svcpill{border:1.5px solid var(--line);border-radius:12px;padding:6px 11px;min-height:46px;background:var(--surface-2);color:var(--ink);font-size:13.5px;font-weight:750;display:inline-flex;align-items:center;gap:4px;max-width:42%;flex:none}
.nv-svcpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv-svcpill:hover{border-color:var(--wine)}
.nv-note{background:var(--surface);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--ink-2);margin:6px 0 0;line-height:1.35}
.nv-big{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:18px;padding:0 18px;min-height:68px;font-size:22px;font-weight:800;text-align:left}
.nv-big small{display:block;font-size:15px;font-weight:600;color:var(--ink-2)}
.nv-more{display:flex;gap:10px}
.nv-more button{flex:1;position:relative;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:12px 6px;min-height:64px;text-align:center;font-size:16px;font-weight:700;line-height:1.2}
.nv-more button i{display:block;font-style:normal;font-size:26px;margin-bottom:3px}
.nv-more .badge{position:absolute;top:6px;right:8px;margin:0}
@media (max-width:720px){
 .app{display:block}
 .app .nv-m{display:flex}.app .nv-d{display:none}
 .app .nv-lbl.nv-m{display:block}
 .app p.nv-note.nv-m{display:block}
 .app div.nv-m{display:block}
 .app .nv-bar.nv-m{display:flex;position:sticky;top:8px;z-index:20;box-shadow:var(--shadow-float)}
 .app .nv-big.nv-m{display:flex}
 .nv-more{display:flex}
 .mast-btns #btnAyuda,.mast-btns #btnNotas,.mast-btns #btnArch{display:none}
 .nv-lists{grid-template-columns:1fr}
 .nv-opt{min-height:68px;padding:10px 14px}.nv-opt .tx{font-size:18px}.nv-opt .tx small{font-size:13.5px}.nv-opt .ic{font-size:26px}.nv-opt .nv-n{min-width:40px;height:34px;font-size:18px}
 .nv-opt.dash{min-height:58px}.nv-opt.dash .tx{font-size:17px}
 .nv-svc{min-height:66px;font-size:21px}
 .nv-side{position:static}
 .app[data-screen="inicio"] .nv-side,.app[data-screen="inicio"] .nv-lista{display:none}
 .app[data-screen="servicios"] .nv-main,.app[data-screen="lista"] .nv-side,.app[data-screen="lista"] .nv-inicio{display:none}
 .app[data-screen="servicios"] .nv-main{display:none}
 .nv-otras{grid-template-columns:1fr}
 .nv-area select{width:100%}
}
@media (max-width:640px){.subrow .progs{flex-wrap:nowrap;overflow-x:auto;margin-inline:-14px;padding-inline:14px;scrollbar-width:none}.subrow .pbtn{flex:none;white-space:nowrap}body{padding-inline:14px}.mast{margin-inline:-14px;padding:12px 14px}.panel-svc .grid{flex-wrap:nowrap;overflow-x:auto;margin-inline:-14px;padding-inline:14px;scrollbar-width:none}.svc-btn{flex:none;white-space:nowrap}.tabs{flex-wrap:nowrap;overflow-x:auto;margin-inline:-14px;padding-inline:14px;scrollbar-width:none}.tab{flex:none}.mast-btns .hbtn{padding:8px 12px;font-size:14px;min-height:44px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

/* ---------- Fechas ---------- */
function toISO(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'&&v>20000&&v<80000)return new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000).toISOString().slice(0,10);
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}
  return null;
}

const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ---------- Lectura del Excel ---------- */
const COLS={det:'fecha de deteccion',nombre:'nombre completo',exp:'expediente',edad:'edad',sexo:'sexo',cama:'cama actual',svc:'servicio actual',prev:'servicios/ubicaciones previas',ing:'fecha de ingreso',prog:'programa de vigilancia',motivo:'motivo de alerta',muestra:'tipo/sitio de muestra',res:'resultado',micro:'microorganismo',disp:'dispositivo',atb:'tratamiento',epi:'estado epidemiologico',notif:'estado de notificacion',oper:'estado operativo',pri:'prioridad',accion:'accion pendiente',resp:'responsable',obs:'observaciones',tipo:'tipo de iaas',rhove:'estado rhove',fcap:'fecha de captura rhove',fres:'fecha del resultado microbiologico',egreso:'fecha de egreso'};
function mapRow(hdr,r){
  const o={};for(const k in COLS){const i=hdr.findIndex(h=>norm(h).startsWith(COLS[k]));const v=i>=0?r[i]:null;if(v!=null&&v!=='')o[k]=v}
  for(const k of ['det','ing','fcap','fres','egreso'])if(k in o)o[k]=toISO(o[k]);
  for(const k in o){if(typeof o[k]==='string')o[k]=o[k].trim();if(o[k]==null||o[k]==='')delete o[k]}
  o.id=[o.exp,o.nombre,o.prog,o.motivo].map(norm).join('|').slice(0,160);
  return o;
}
function parseWorkbook(wb){
  const name=wb.SheetNames.find(n=>norm(n).includes('radar activo'))||wb.SheetNames[0];
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
  const hi=aoa.findIndex(r=>r&&r.some(c=>norm(c)==='fecha de deteccion'));
  if(hi<0)throw new Error('No encontré la fila de encabezados (“Fecha de detección”) en la hoja RADAR ACTIVO.');
  const hdr=aoa[hi].map(c=>String(c??''));
  const rows=aoa.slice(hi+1).filter(r=>r&&r.some(c=>c!=null&&String(c).trim()!=='')).map(r=>mapRow(hdr,r)).filter(o=>o.nombre||o.cama);
  let corte=null;const title=aoa.slice(0,hi).flat().filter(Boolean).join(' ');
  const m=title.match(/corte\s+(\d{1,2}\/\d{1,2}\/\d{4})/i);if(m)corte=toISO(m[1]);
  let nota='';const rs=wb.SheetNames.find(n=>norm(n).includes('resumen'));
  if(rs){for(const r of XLSX.utils.sheet_to_json(wb.Sheets[rs],{header:1,raw:true,defval:null})){if(!r)continue;const k=norm(r[0]);if(k==='nota'&&r[1])nota=String(r[1]);if(k.includes('fecha de corte')&&!corte)corte=toISO(r[1])}}
  if(!corte){const ds=rows.map(r=>r.det).filter(Boolean).sort();corte=ds[ds.length-1]||null}
  const abRows=parseAntibiogramas(wb);
  const cerrados=parseCerrados(wb,rows);
  return {rows,cerrados,corte,nota,abRows};
}
// Hoja "HISTORIAL - CERRADOS": pacientes que ya salieron del RADAR ACTIVO (egreso, defunción,
// traslado, o que ya no aparecen en los censos). Mismas columnas que RADAR ACTIVO.
function parseCerrados(wb,activos){
  const name=wb.SheetNames.find(n=>norm(n).includes('historial'));
  if(!name)return [];
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
  const hi=aoa.findIndex(r=>r&&r.some(c=>norm(c)==='fecha de deteccion'));
  if(hi<0)return [];
  const hdr=aoa[hi].map(c=>String(c??''));
  const act=new Set((activos||[]).map(r=>r.id));
  return aoa.slice(hi+1).filter(r=>r&&r.some(c=>c!=null&&String(c).trim()!=='')).map(r=>mapRow(hdr,r)).filter(o=>(o.nombre||o.cama)&&!act.has(o.id))
    .map(o=>{if(o.obs&&o.obs.length>500)o.obs='…'+o.obs.slice(-500);return o});
}
// Hoja opcional "ANTIBIOGRAMAS" (formato largo: 1 fila por antibiótico, con Código + Categoría S/I/R).
function parseAntibiogramas(wb){
  const name=wb.SheetNames.find(n=>norm(n).includes('antibiograma'));
  if(!name)return [];
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
  const hi=aoa.findIndex(r=>r&&r.some(c=>norm(c).startsWith('paciente')));
  if(hi<0)return [];
  const hdr=aoa[hi].map(c=>norm(c));
  const ci=k=>hdr.findIndex(h=>h.startsWith(k));
  const iPac=ci('paciente'),iMic=ci('microorganismo'),iCod=ci('codigo'),iCat=ci('categoria'),iFecha=ci('fecha de estudio'),iFolio=ci('folio');
  if(iPac<0||iMic<0||iCod<0||iCat<0)return [];
  const out=[];
  for(let i=hi+1;i<aoa.length;i++){
    const r=aoa[i];if(!r)continue;
    const pac=r[iPac];if(!pac)continue;
    const cat=String(r[iCat]??'').trim().toUpperCase();
    if(!cat)continue;
    out.push({pac:String(pac).trim(),mic:r[iMic],cod:String(r[iCod]??'').trim().toUpperCase(),cat:cat[0],fecha:toISO(r[iFecha])||'',folio:r[iFolio]!=null?String(r[iFolio]).trim():''});
  }
  return out;
}

/* ---------- Marcas compartidas: Revisado / Descartado ---------- */
const mkD=r=>'d|'+[r.exp,r.nombre,r.prog].map(norm).join('|');
const mkR=r=>'r|'+r.id;
const indexMarcas=l=>{const o={};(l||[]).forEach(m=>{o[m.key]=m});return o};
const corto=e=>String(e||'').split('@')[0];
function aplicarMarcas(rows){
  if(!MARCAS){DONE={...LOCAL};return}
  const d={};
  rows.forEach(r=>{const m=MARCAS[mkD(r)]||MARCAS[mkR(r)];if(m)d[r.id]={at:m.fecha,cls:m.tipo==='descartado'?'sin_iaas':'revisado',autor:m.autor,fecha:m.fecha}});
  DONE=d;
  if(!migrando&&Object.keys(LOCAL).length){
    const its=[],ids=[];
    rows.forEach(r=>{const v=LOCAL[r.id];if(!v)return;ids.push(r.id);if(d[r.id])return;const desc=typeof v==='object'&&v.cls==='sin_iaas';its.push({key:desc?mkD(r):mkR(r),tipo:desc?'descartado':'revisado',activa:true,nombre:r.nombre||'',cama:r.cama||'',servicio:grupo(r)||''})});
    if(its.length||ids.length){migrando=true;
      const fin=()=>{ids.forEach(i=>delete LOCAL[i]);store.set('uveh_done',LOCAL);migrando=false};
      if(its.length)enviarMarcas(its,fin);else{fin()}}
  }
}
function cargarMarcas(){
  google.script.run
    .withSuccessHandler(res=>{MARCAS=indexMarcas(res);render()})
    .withFailureHandler(()=>{})
    .listarMarcas();
}
function enviarMarcas(items,ok){
  google.script.run
    .withSuccessHandler(res=>{MARCAS=indexMarcas(res);render();ok&&ok()})
    .withFailureHandler(err=>{migrando=false;const sin=String(err&&err.message||'').includes('SIN_ACCESO_NOTAS');toast(sin?'Tu cuenta no puede guardar marcas compartidas. Pide a UVEH que te comparta la hoja de notas.':'No se pudo guardar la marca. Intenta de nuevo.')})
    .guardarMarcas(JSON.stringify(items));
}
function marcar(r,tipo){
  const key=tipo==='descartado'?mkD(r):mkR(r);
  if(MARCAS){MARCAS[key]={key,tipo,autor:'tú',fecha:new Date().toISOString()};render();
    enviarMarcas([{key,tipo,activa:true,nombre:r.nombre||'',cama:r.cama||'',servicio:grupo(r)||''}])}
  else{LOCAL[r.id]=tipo==='descartado'?{at:STATE.corte||true,cls:'sin_iaas'}:(STATE.corte||true);store.set('uveh_done',LOCAL);render()}
}
function desmarcar(r){
  if(MARCAS){const its=[];[mkD(r),mkR(r)].forEach(k=>{if(MARCAS[k]){its.push({key:k,tipo:k[0]==='d'?'descartado':'revisado',activa:false,nombre:r.nombre||'',cama:r.cama||'',servicio:grupo(r)||''});delete MARCAS[k]}});
    render();if(its.length)enviarMarcas(its)}
  else{delete LOCAL[r.id];store.set('uveh_done',LOCAL);render()}
}

/* ---------- Clasificación ---------- */
// Un paciente también cuenta como (probable) IAAS si comparte microorganismo y servicio
// con otro paciente (mismo criterio que "Posibles brotes"), aunque el RADAR del día no lo
// haya marcado todavía con programa "IAAS" — así las dos pestañas avisan de lo mismo.
let BROTE_IDS=new Set();let ATB_INDEX={};
const isIAAS=r=>norm(r.prog).includes('iaas')||BROTE_IDS.has(r.id);
const rhoveCapt=r=>norm(r.rhove).startsWith('capturada');
const descart=r=>norm(r.epi).startsWith('descartad')||norm(r.rhove).startsWith('descartad');
const isFoco=r=>isIAAS(r)&&!rhoveCapt(r)&&!descart(r);
const egresado=r=>!!r.egreso||/egres|defunc|traslad|cerrad/.test(norm(r.oper));
function motivoEgr(r){
  const o=norm(r.oper);
  if(/defunc/.test(o))return 'Defunción';
  if(/traslad/.test(o))return 'Traslado';
  if(/ambulator|consulta externa/.test(o))return 'Ambulatorio';
  if(/egres/.test(o)||r.egreso)return 'Egreso';
  if(/no localizad|sin localiz/.test(o))return 'No localizado en censo';
  return 'Cerrado';
}
const esNuevo=r=>!!(STATE.corte&&r.det&&daysBetween(r.det,STATE.corte)<=1);
const cultRec=r=>!!(r.fres&&STATE.corte&&daysBetween(r.fres,STATE.corte)>=0&&daysBetween(r.fres,STATE.corte)<=2);
function cultPend(r){
  if(r.muestra&&!r.res)return true;
  if(r.res&&norm(r.res).includes('pendient'))return true;
  if(rhoveCapt(r)&&!r.muestra&&!r.micro&&!r.res)return true;
  return false;
}
function sinCultivo(r){
  if(!isIAAS(r)||descart(r)||rhoveCapt(r))return false;
  return !r.muestra&&!r.micro&&!r.res;
}
function cultSinCapturar(r){
  if(!isIAAS(r)||!rhoveCapt(r))return false;
  return microChips(r).some(m=>!m.captured);
}
const esReingreso=r=>/reingres/.test(norm([r.motivo,r.obs].join(' ')));

/* Agrupación de servicios y caché por fila (WeakMap, sin mutar STATE.rows) */
const GRUPOS=[
 [/^(ucim|ucin|utip|uti pediatrica|unidad de terapia intermedia pediatrica|terapia intermedia pediatrica|lactantes|escolares|preescolares|pediatria|nefrologia pediatrica|oncologia pediatrica|urgencias pediatricas|observacion pediatrica|neonatologia|cunero)/,'Pediatría'],
 [/^(ginecologia|obstetricia|tococirugia)/,'Ginecología y Obstetricia'],
 [/^hemodialisis/,'Medicina Interna'],
 [/^dialisis/,'Diálisis'],
 [/^(cirugia oncologica|urologia|cirugia general)/,'Cirugía General'],
 [/^(medicina interna|nefrologia|oncologia)/,'Medicina Interna'],
 [/^(traumatologia|tyo)/,'TYO'],
 [/^(unidad de quemados|quemados)/,'Unidad de Quemados'],
 [/^urgencias/,'Urgencias Adultos'],
 [/^ucia/,'UCIA'],
];
const CANON={'infectologia':'Infectología','neumologia':'Neumología','neurologia':'Neurología','neurocirugia':'Neurocirugía','cardiologia':'Cardiología','cirugia reconstructiva':'Cirugía Reconstructiva','coloproctologia':'Coloproctología','otorrinolaringologia':'Otorrinolaringología','hematologia':'Hematología','oncohematologia':'Oncohematología','gastroenterologia':'Gastroenterología','consulta externa':'Consulta Externa'};
const SUB={'Medicina Interna':[[/^hemodialisis/,'Hemodiálisis'],[/^nefrologia/,'Nefrología'],[/^oncologia/,'Oncología']],'Cirugía General':[[/^cirugia oncologica/,'Cirugía Oncológica'],[/^urologia/,'Urología']],'Pediatría':[[/^ucim/,'UCIM'],[/^ucin/,'UCIN'],[/^(utip|uti pediatrica|unidad de terapia intermedia pediatrica|terapia intermedia pediatrica)/,'UTIP']]};
const SUBPED_L=[['Lactantes',/\blactantes?\b/],['Escolares',/\bescolares?\b/],['Oncohematología',/onco\s*-?\s*hemato|\bhematooncolog|\boncopediatri/],['UCIM',/\bucim\b/],['UCIN',/\bucin\b/],['UTIP',/\butip\b/],['Terapia Intermedia',/terapia intermedia/],['Nefrología pediátrica',/\bnefro/],['Urgencias',/\burgencias\b/],['Observación',/\bobservacion\b/]];
const RENAL_L=[['Hemodiálisis',/\bhemodialisis\b/,/\bhemodialisis\b|\b(erc|enfermedad renal cronica)\b[^.;\/\n]{0,60}?\b(hd|tsfr)\b/],['Diálisis peritoneal',/dialisis peritoneal|\bdp\b|cateter\s+(?:de|para)\s+dialisis/,/dialisis peritoneal|\bdp\b|cateter\s+(?:de|para)\s+dialisis/]];
const SUBS={'Pediatría':{l:SUBPED_L,sin:true},'Medicina Interna':{l:RENAL_L,sin:false,dx:true},'Urgencias Adultos':{l:RENAL_L,sin:false,dx:true}};
const ubicObs=r=>{const m=String(r.obs||'').match(/(?:localizado en|→)\s*(?:Pediatr[ií]a|Medicina Interna|Urgencias),\s*([^,\n]+?)\s*,\s*cama/i);return m?m[1]:''};
const dxCenso=r=>{const m=String(r.obs||'').match(/diagn[oó]stico censal[^:\n]*:\s*([^\n]*)/i);return norm((m?m[1]:'')+' '+(r.motivo||''))};
function _grupo(r){const first=String(r.svc||'').split('/')[0].trim();if(!first)return 'Sin servicio';const n=norm(first);for(const [re,l] of GRUPOS)if(re.test(n))return l;return CANON[n]||first.toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase())}
function _subgrupo(r,g){const rules=SUB[g];if(!rules)return'';const n=norm(String(r.svc||'').split('/')[0]);for(const [re,l] of rules)if(re.test(n))return l;return g}
function _subPed(r,g){const c=SUBS[g];if(!c)return '';const t=norm([r.svc,r.cama,ubicObs(r)].join(' '));const dx=c.dx?dxCenso(r):'';for(const [l,re,dre] of c.l)if(re.test(t)||(dre&&dre.test(dx)))return l;return ''}
const _pacKey=r=>{const e=norm(r.exp);return e?'exp:'+e:'nc:'+norm(r.nombre)+'|'+norm(r.cama)};
function rowMeta(r){
  if(!r||typeof r!=='object')return {grupo:'Sin servicio',subgrupo:'',subPed:'',priN:4,pacKey:'nc:|',q:'',qBrote:''};
  let m=ROW_CACHE.get(r);
  if(!m){
    const g=_grupo(r);
    m={grupo:g,subgrupo:_subgrupo(r,g),subPed:_subPed(r,g),priN:PRI[norm(r.pri)]??4,pacKey:_pacKey(r),q:norm([r.nombre,r.cama,r.exp,r.micro,r.motivo,r.svc,r.tipo].join(' ')),qBrote:norm([r.nombre,r.cama,r.exp,r.micro,r.svc].join(' '))};
    ROW_CACHE.set(r,m);
  }
  return m;
}
function priN(r){return rowMeta(r).priN}
function grupo(r){return rowMeta(r).grupo}
function subgrupo(r){return rowMeta(r).subgrupo}
function subPed(r){return rowMeta(r).subPed}
function pacKey(r){return rowMeta(r).pacKey}
function indexPorPac(list){
  const byK=new Map(),byN=new Map();
  (list||[]).forEach((x,idx)=>{
    const it={x,idx};
    if(x&&x.id){let a=byK.get(x.id);if(!a){a=[];byK.set(x.id,a)}a.push(it)}
    const nn=normNom(x&&x.nombre);
    if(nn){let b=byN.get(nn);if(!b){b=[];byN.set(nn,b)}b.push(it)}
  });
  return [byK,byN];
}
function lookupPorPac(byK,byN,pid,nombre){
  const a=pid?byK.get(pid):null,nn=normNom(nombre),b=nn?byN.get(nn):null;
  if(!a&&!b)return [];
  if(a&&!b)return a.map(o=>o.x);
  if(!a&&b)return b.map(o=>o.x);
  const m=new Map();
  a.forEach(o=>m.set(o.idx,o.x));b.forEach(o=>m.set(o.idx,o.x));
  return [...m.entries()].sort((p,q)=>p[0]-q[0]).map(e=>e[1]);
}

/* Posibles brotes */
const GEN={k:'klebsiella',a:'acinetobacter',p:'pseudomonas',s:'staphylococcus',c:'candida'};
function orgs(txt){if(!txt)return[];const t=norm(txt);if(/no se aisl|sin desarrollo|^vih$|negativ/.test(t))return[];
  return t.replace(/\([^)]*\)/g,'').split(/;|\/|\+|,|\by\b/).map(x=>x.trim()).filter(Boolean).map(x=>{x=x.replace(/\b(complex|complejo|subs?p?\.?\s+\w+|spp?\.?)\b/g,'').replace(/\s+/g,' ').trim();const w=x.split(' ');if(w.length<2)return null;let g=w[0].replace('.',''),s=w[1];if(g.length<=2){if(g==='e')g=s==='coli'?'escherichia':(s==='cloacae'||s==='aerogenes'?'enterobacter':'e');else g=GEN[g]||g}return `${g} ${s}`}).filter(Boolean)}
const pretty=k=>{const [g,s]=k.split(' ');return g[0].toUpperCase()+g.slice(1)+' '+s};
function microChips(r){
  const raw=String(r.micro||'');
  if(!raw||!orgs(raw).length)return[];
  const holders=[];
  const safe=raw.replace(/\([^)]*\)/g,m=>{holders.push(m);return `\u0000${holders.length-1}\u0000`});
  return safe.split(/;|\/|\+|,|\by\b/i).map(x=>x.trim()).filter(Boolean).map(tok=>{
    const restored=tok.replace(/\u0000(\d+)\u0000/g,(_,i)=>holders[+i]);
    const marcaPend=/\(\s*pendiente[^)]*\)/i.test(restored);
    const label=restored.replace(/\(\s*pendiente[^)]*\)/ig,'').replace(/\s+/g,' ').trim();
    return {label,captured:rhoveCapt(r)&&!marcaPend};
  });
}

const LIBS=Object.assign({pdfjs:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfjsw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',pdflib:'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js',tess:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'},window.UVEH_LIBS||{});
let LOTE=null;
const freeCanvas=c=>{if(c){c.width=0;c.height=0}};
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('No se pudo cargar '+u));document.head.appendChild(s)});
async function loteLibs(){
  if(!window.pdfjsLib)await loadScript(LIBS.pdfjs);
  if(!window.PDFLib)await loadScript(LIBS.pdflib);

const LSTOP=new Set(['de','la','del','ho','hijo','hija','los','las','el','y']);
const toks=s=>norm(s).replace(/[^a-z ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!LSTOP.has(w));
function lev1(a,b){if(a===b)return true;if(Math.abs(a.length-b.length)>1||a.length<6)return false;let i=0;while(i<a.length&&a[i]===b[i])i++;if(a.length===b.length)return a.slice(i+1)===b.slice(i+1);return a.length>b.length?a.slice(i+1)===b.slice(i):b.slice(i+1)===a.slice(i)}
const tokIn=(w,set)=>{for(const k of set)if(lev1(w,k))return true;return false};
function lotePacientes(){
  const m=new Map();
  (STATE.rows||[]).forEach(r=>{const k=pacKey(r);if(!m.has(k))m.set(k,{pid:k,nombre:r.nombre||'',cama:r.cama||'',servicio:grupo(r)||'',t:toks(r.nombre||'')})});
  return [...m.values()].sort((a,b)=>a.servicio.localeCompare(b.servicio,'es')||a.nombre.localeCompare(b.nombre,'es'));

function loteMatch(nombreOcr,pacs){
  const w=toks(String(nombreOcr).replace(',',' '));if(w.length<2)return null;
  const hits=[];
  for(const p of pacs){
    const k=new Set(p.t);if(k.size<2)continue;for(let q=0;q<p.t.length-1;q++)k.add(p.t[q]+p.t[q+1]);
    const [chico,gran]=w.length<=k.size?[w,k]:[[...k],new Set(w)];
    if(Math.min(w.length,p.t.length)<3)continue;
    if(chico.every(x=>tokIn(x,gran)))hits.push(p);
  }
  return hits.length===1?hits[0]:null;
}
function loteNombreOCR(t){
  const x=String(t||'').replace(/\r/g,'');
  let m=x.match(/Paciente:?[ \t]*([A-ZÑÁÉÍÓÚ][A-ZÑÁÉÍÓÚ .'-]+,[ \t]*[A-ZÑÁÉÍÓÚ .'-]+)/);
  if(!m)m=x.match(/^[ \t]*([A-ZÑÁÉÍÓÚ][A-ZÑÁÉÍÓÚ .'-]+,[ \t]*[A-ZÑÁÉÍÓÚ .'-]+)[ \t]*$/m);
  return m?m[1].replace(/\s+/g,' ').trim().replace(/(\s+[^A-ZÑÁÉÍÓÚ ]*[A-ZÑ]{0,2}[^A-ZÑÁÉÍÓÚ ]*)+$/,x=>/,/.test(x)?x:'').replace(/\s+\S{1,2}$/,'').replace(/[\s-]+$/,'').trim():'';
}
async function loteAnalizar(file){
  LOTE={nombre:file.name,pages:[],fase:'leyendo',msg:'Abriendo el PDF…',prog:0,bytes:null};renderLote();
  let pdf=null,worker=null;
  try{
    await loteLibs();
    LOTE.bytes=await file.arrayBuffer();
    pdf=await pdfjsLib.getDocument({data:LOTE.bytes.slice(0)}).promise;
    const n=pdf.numPages;let ocrOk=true;
    try{await loadScript(LIBS.tess);worker=await Tesseract.createWorker('eng',1,window.UVEH_TESS||{});}catch(e){ocrOk=false}
    LOTE.ocrOk=ocrOk;
    const pacs=lotePacientes();
    for(let i=1;i<=n;i++){
      LOTE.msg=`Leyendo hoja ${i} de ${n}…`;LOTE.prog=(i-1)/n;renderLote();
      let pg=null,full=null,th=null,crop=null;
      try{
        pg=await pdf.getPage(i);
        const v2=pg.getViewport({scale:2});
        full=document.createElement('canvas');full.width=v2.width;full.height=v2.height;
        await pg.render({canvasContext:full.getContext('2d'),viewport:v2}).promise;
        th=document.createElement('canvas');const sc=360/full.width;th.width=360;th.height=Math.round(full.height*sc);
        th.getContext('2d').drawImage(full,0,0,th.width,th.height);
        const page={n:i,thumb:th.toDataURL('image/jpeg',.6),ocr:'',texto:'',sel:'',estado:''};
        freeCanvas(th);th=null;
        if(worker){
          try{
            const h=Math.round(full.height*.3);crop=document.createElement('canvas');crop.width=full.width;crop.height=h;
            crop.getContext('2d').drawImage(full,0,0,full.width,h,0,0,full.width,h);
            const r=await worker.recognize(crop);page.texto=r.data.text||'';
            freeCanvas(crop);crop=null;
            page.ocr=loteNombreOCR(page.texto);
            if(!page.ocr){const r2=await worker.recognize(full);page.texto=r2.data.text||'';page.ocr=loteNombreOCR(page.texto)}
            const hit=page.ocr?loteMatch(page.ocr,pacs):null;
            if(hit){page.sel=hit.pid;page.estado='ok'}
            else if(/consulta\s*ext/i.test(page.texto)){page.sel='_omitir';page.estado='om'}
            else page.estado='rev';
          }catch(e){page.estado='rev'}
        }else page.estado='rev';
        LOTE.pages.push(page);
      }finally{
        freeCanvas(crop);freeCanvas(th);freeCanvas(full);
        if(pg&&pg.cleanup)try{pg.cleanup()}catch(e){}
      }
    }
    LOTE.fase='revisar';LOTE.msg='';LOTE.prog=1;
  }catch(e){LOTE.fase='error';LOTE.msg='No se pudo procesar el PDF: '+(e&&e.message||e)}
  finally{
    if(worker)try{await worker.terminate()}catch(e){}
    if(pdf&&pdf.destroy)try{await pdf.destroy()}catch(e){}
  }
  renderLote();
}

const u8b64=u=>{let s='',k=0x8000;for(let i=0;i<u.length;i+=k)s+=String.fromCharCode.apply(null,u.subarray(i,i+k));return btoa(s)};

async function loteComprimir(nums){
  let pdf=null;

    pdf=await pdfjsLib.getDocument({data:LOTE.bytes.slice(0)}).promise;
    const out=await PDFLib.PDFDocument.create();
    for(const n of nums){
      let pg=null,cv=null;
      try{
        pg=await pdf.getPage(n);const vp=pg.getViewport({scale:1.5});
        cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);

        const w=cv.width,h=cv.height;
        const jb=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.65));

      }finally{
        freeCanvas(cv);
        if(pg&&pg.cleanup)try{pg.cleanup()}catch(e){}
      }
    }

  }finally{
    if(pdf&&pdf.destroy)try{await pdf.destroy()}catch(e){}
  }
}

document.addEventListener('change',e=>{
  if(e.target.id==='loteFile'){const f=e.target.files&&e.target.files[0];if(f)loteAnalizar(f);return}
  if(e.target.dataset&&e.target.dataset.loteidx!==undefined&&LOTE){const p=LOTE.pages[Number(e.target.dataset.loteidx)];p.sel=e.target.value;if(p.sel&&p.estado!=='ok')p.estado='man';renderLote()}
});
document.addEventListener('click',e=>{
  const im=e.target.closest&&e.target.closest('img[data-loteimg]');
  if(im){const open=!im.classList.contains('big');cerrarZoom();if(open){im.classList.add('big');const bd=$('#imgBackdrop');if(bd)bd.hidden=false}return}
  if(document.querySelector('.lote-row img.big')){cerrarZoom();e.stopPropagation()}
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&cerrarZoom()){e.preventDefault();return}
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.matches&&e.target.matches('img[data-loteimg]')){e.preventDefault();e.target.click()}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='btnRefresh'){cargar(false);return}
  if(t.id==='btnAyuda'){const a=$('#ayuda');a.hidden=!a.hidden;if(!a.hidden)a.scrollIntoView({block:'start'});return}
  if(t.id==='btnAyudaCerrar'){$('#ayuda').hidden=true;store.set('uveh_ayuda',1);return}
  if(t.dataset.qclear){clearTimeout(qT);QTXT='';const qi=$('#q');if(qi){qi.value='';qi.focus()}const qc=$('#qClear');if(qc)qc.hidden=true;render();return}
  if(t.dataset.backsvc){SCREEN=PREV_SCREEN==='lista'?'lista':'inicio';render();return}
  if(t.dataset.screen){if(t.dataset.screen==='servicios')PREV_SCREEN=SCREEN;else if(t.dataset.screen==='inicio')PREV_SCREEN='inicio';SCREEN=t.dataset.screen;render();window.scrollTo({top:0});return}
  if(t.dataset.go){const b=document.getElementById(t.dataset.go);if(b)b.click();return}
  if(t.dataset.otras){OTRAS=!OTRAS;render();return}
  if(t.dataset.sub!==undefined){FSUB=t.dataset.sub;render();return}
  if(t.dataset.svc!==undefined){SCREEN=PREV_SCREEN==='lista'?'lista':'inicio';FGRP=t.dataset.svc;FSUB='';store.set('uveh_svc',FGRP);render();window.scrollTo({top:0});toast(FGRP?`Mostrando ${FGRP}`:'Mostrando todos los servicios');return}
  if(t.dataset.tab){TAB=t.dataset.tab;OTRAS=false;SCREEN='lista';PREV_SCREEN='lista';store.set('uveh_tab',TAB);render();window.scrollTo({top:0});return}
  if(t.dataset.prog!==undefined){FPROG=t.dataset.prog;render();return}
  if(t.dataset.egr!==undefined){FEGR=t.dataset.egr;render();return}
  if(t.dataset.atbview!==undefined){ATBVIEW=t.dataset.atbview;render();return}
  if(t.dataset.critsave){const id=t.dataset.critsave,r=(STATE.rows||[]).find(x=>x.id===id),tt=CRIT_TMP[id];
    if(!r||!tt)return;
    if(!tt.cat||!tt.cumple){toast('Elige el tipo de IAAS y si cumple criterios.');return}
    if(!MARCAS){toast('Para guardar criterios hace falta acceso a la hoja de notas. Pide a UVEH que te la comparta.');return}
    const key=mkC(r),detalle={cat:tt.cat,marcados:[...tt.marcados],cumple:tt.cumple};
    MARCAS[key]={key,tipo:'criterios',autor:'tú',fecha:new Date().toISOString(),detalle};
    OPEN['crit|'+id]=false;delete CRIT_TMP[id];renderConAncla(t);
    enviarMarcas([{key,tipo:'criterios',activa:true,nombre:r.nombre||'',cama:r.cama||'',servicio:grupo(r)||'',detalle}]);
    toast('Criterios guardados');return}
  if(t.dataset.grp){OPEN[t.dataset.grp]=t.getAttribute('aria-expanded')!=='true';renderConAncla(t);return}
  if(t.dataset.done){const id=t.dataset.done,r=(STATE.rows||[]).find(x=>x.id===id);if(!r)return;if(DONE[id]){desmarcar(r);toast('Se regresó a la lista')}else{marcar(r,'revisado');toast('✓ Marcado como revisado')}return}
  if(t.dataset.siniaas){const id=t.dataset.siniaas,r=(STATE.rows||[]).find(x=>x.id===id);if(!r)return;marcar(r,'descartado');toast('✓ Marcado como Descartado');return}
  if(t.dataset.nefedit!==undefined){notaFichaEditKey=t.dataset.nefedit;renderConAncla(t);return}
  if(t.dataset.nefcancel!==undefined){notaFichaEditKey=null;renderConAncla(t);return}
  if(t.dataset.nefsave!==undefined){const key=t.dataset.nefsave,wrap=t.closest('.pac-nota'),ta=wrap?wrap.querySelector('textarea'):null,v=ta?ta.value.trim():'';STATE.notasEnf=STATE.notasEnf||{};if(v)STATE.notasEnf[key]=v;else delete STATE.notasEnf[key];notaFichaEditKey=null;renderConAncla(t);publicar();return}
  if(t.id==='btnWA'){$('#secWA').hidden=false;$('#waText').value=waText();$('#secWA').scrollIntoView({block:'start'});return}
  if(t.id==='btnCloseWA'){$('#secWA').hidden=true;return}
  if(t.id==='btnCopy'){const v=$('#waText').value,fb=()=>{$('#waText').select();toast('Selecciona el texto y cópialo con Ctrl+C')};try{navigator.clipboard.writeText(v).then(()=>toast('Copiado. Pégalo en WhatsApp.'),fb)}catch(_){fb()}}
  if(t.id==='btnNotas'){const p=$('#panelNotas');p.hidden=!p.hidden;if(!p.hidden){renderNotasPanel();p.scrollIntoView({block:'start'})}return}
  if(t.id==='btnNotasCerrar'){$('#panelNotas').hidden=true;return}
  if(t.id==='btnArch'){const p=$('#panelArch');p.hidden=!p.hidden;if(!p.hidden){renderArchPanel();p.scrollIntoView({block:'start'})}return}
  if(t.id==='btnArchCerrar'){$('#panelArch').hidden=true;return}
  if(t.dataset.notatoggle){const id=t.dataset.notatoggle,f=document.querySelector(`[data-notaform="${CSS.escape(id)}"]`);if(f){f.hidden=!f.hidden;if(!f.hidden){const ta=f.querySelector('textarea');ta&&ta.focus()}}return}
  if(t.dataset.notacancel){const id=t.dataset.notacancel,f=document.querySelector(`[data-notaform="${CSS.escape(id)}"]`);if(f){f.hidden=true;const ta=f.querySelector('textarea');if(ta)ta.value=''}return}
  if(t.dataset.notasend){const id=t.dataset.notasend,f=document.querySelector(`[data-notaform="${CSS.escape(id)}"]`),ta=f&&f.querySelector('textarea'),texto=(ta&&ta.value||'').trim();
    if(!texto){toast('Escribe la nota antes de enviar');return}
    const r=(STATE.rows||[]).find(x=>pacKey(x)===id)||{};
    t.disabled=true;t.textContent='Enviando…';
    google.script.run
      .withSuccessHandler(res=>{setNotas(res);toast('Nota enviada a UVEH');if(ta)ta.value='';if(f)f.hidden=true;renderNotasBadge();render()})
      .withFailureHandler(err=>{const sin=String(err&&err.message||'').includes('SIN_ACCESO_NOTAS');toast(sin?'Tu cuenta no tiene permiso para dejar notas. Pide a UVEH que te comparta la hoja de notas.':'No se pudo enviar la nota. Inténtalo de nuevo.');t.disabled=false;t.textContent='Enviar nota'})
      .guardarNotaCambio(JSON.stringify({id,nombre:r.nombre||'',cama:r.cama||'',servicio:grupo(r)||'',texto}));
    return}
  if(t.dataset.notaedit){EDITN=Number(t.dataset.notaedit);DELN=0;renderNotasPanel();const ta=document.querySelector('[data-notaedtxt]');ta&&ta.focus();return}
  if(t.dataset.notaedcancel){EDITN=0;renderNotasPanel();return}
  if(t.dataset.notaedsave){const ta=document.querySelector('[data-notaedtxt]'),texto=(ta&&ta.value||'').trim();if(!texto){toast('La nota no puede quedar vacía');return}
    t.disabled=true;t.textContent='Guardando…';
    google.script.run
      .withSuccessHandler(res=>{setNotas(res);EDITN=0;renderNotasBadge();renderNotasPanel();render();toast('Nota actualizada')})
      .withFailureHandler(err=>{toast('No se pudo guardar: '+(err&&err.message||'inténtalo de nuevo'));t.disabled=false;t.textContent='Guardar cambios'})
      .editarNotaCambio(t.dataset.notaedsave,texto);
    return}
  if(t.dataset.notadelask){DELN=Number(t.dataset.notadelask);EDITN=0;renderNotasPanel();return}
  if(t.dataset.notadelcancel){DELN=0;renderNotasPanel();return}
  if(t.dataset.notadel){t.disabled=true;t.textContent='Borrando…';
    google.script.run
      .withSuccessHandler(res=>{setNotas(res);DELN=0;renderNotasBadge();renderNotasPanel();render();toast('Nota borrada')})
      .withFailureHandler(err=>{toast('No se pudo borrar: '+(err&&err.message||'inténtalo de nuevo'));t.disabled=false;t.textContent='Sí, borrar'})
      .eliminarNotaCambio(t.dataset.notadel);
    return}
  if(t.dataset.notadone){t.disabled=true;t.textContent='Marcando…';
    google.script.run
      .withSuccessHandler(res=>{setNotas(res);renderNotasBadge();renderNotasPanel();toast('Nota marcada como aplicada')})
      .withFailureHandler(err=>{toast('No se pudo marcar: '+(err&&err.message||'inténtalo de nuevo'));t.disabled=false;t.textContent='✓ Ya lo pasé al Excel'})
      .marcarNotaAplicada(t.dataset.notadone);
    return}
  if(t.dataset.lote==='abrir'){LOTE={fase:'elegir'};renderLote();return}
  if(t.dataset.lote==='cancelar'){LOTE=null;renderLote();return}
  if(t.dataset.lote==='enviar'){loteEnviar();return}
  if(t.dataset.archtoggle){const id=t.dataset.archtoggle,f=document.querySelector(`[data-archform="${CSS.escape(id)}"]`);if(f){f.hidden=!f.hidden}return}
  if(t.dataset.archcancel){const id=t.dataset.archcancel,f=document.querySelector(`[data-archform="${CSS.escape(id)}"]`);if(f){f.hidden=true;const inp=f.querySelector('input[type=file]');if(inp)inp.value=''}return}
  if(t.dataset.archsend){const id=t.dataset.archsend,f=document.querySelector(`[data-archform="${CSS.escape(id)}"]`),inp=f&&f.querySelector('input[type=file]'),file=inp&&inp.files&&inp.files[0];
    if(!file){toast('Elige una foto o PDF antes de subir');return}
    if(file.size>15*1024*1024){toast('El archivo es demasiado grande (máximo 15 MB)');return}
    const nombre=f.dataset.nombre||'',cama=f.dataset.cama||'',servicio=f.dataset.servicio||'';
    t.disabled=true;t.textContent='Subiendo…';
    const rd=new FileReader();
    rd.onload=ev=>{
      const base64=String(ev.target.result||'').split(',')[1]||'';
      google.script.run
        .withSuccessHandler(res=>{setArchivos(res);renderArchPanel();toast('Cultivo adjuntado');if(inp)inp.value='';if(f)f.hidden=true;t.disabled=false;t.textContent='Subir';render()})
        .withFailureHandler(err=>{const sin=String(err&&err.message||'').includes('SIN_ACCESO_CULTIVOS');toast(sin?'Tu cuenta no tiene permiso para adjuntar archivos. Pide a UVEH que te comparta la carpeta de cultivos.':'No se pudo subir el archivo. Inténtalo de nuevo.');t.disabled=false;t.textContent='Subir'})
        .subirCultivo(JSON.stringify({id,nombre,cama,servicio,filename:file.name,mimeType:file.type||'application/octet-stream',base64}));
    };
    rd.onerror=()=>{toast('No se pudo leer el archivo');t.disabled=false;t.textContent='Subir'};
    rd.readAsDataURL(file);
    return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.critcat!==undefined){const t=CRIT_TMP[el.dataset.critcat];if(t){t.cat=el.value;t.marcados=[]}renderConAncla(el);return}
  if(el.dataset.critchk!==undefined){const t=CRIT_TMP[el.dataset.critchk];if(t){const i=+el.value;t.marcados=el.checked?[...new Set([...t.marcados,i])]:t.marcados.filter(x=>x!==i)}return}
  if(el.dataset.critcumple!==undefined){const t=CRIT_TMP[el.dataset.critcumple];if(t)t.cumple=el.value;return}
});
document.addEventListener('change',e=>{if(e.target.id==='subSel'){FSUB=e.target.value;render()}});
let qT=null,qComp=false;
document.addEventListener('compositionstart',e=>{if(e.target&&e.target.id==='q')qComp=true});
document.addEventListener('compositionend',e=>{if(e.target&&e.target.id==='q'){qComp=false;QTXT=e.target.value;const qc=$('#qClear');if(qc)qc.hidden=!QTXT;clearTimeout(qT);qT=setTimeout(render,150)}});
document.addEventListener('input',e=>{
  if(e.target.id==='archQ'){renderArchPanel();return}
  if(e.target.id==='q'){QTXT=e.target.value;const qc=$('#qClear');if(qc)qc.hidden=!QTXT;if(e.isComposing||qComp)return;clearTimeout(qT);qT=setTimeout(render,150)}
});

if(!store.get('uveh_ayuda',0))$('#ayuda').hidden=false;
render();
cargar(false);
cargarNotas();
cargarArchivos();
cargarMarcas();
setInterval(()=>{if(!document.hidden){cargar(true);cargarNotas();cargarArchivos();cargarMarcas()}},10*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){cargar(true);cargarNotas();cargarArchivos();cargarMarcas()}});
}
if(document.body)boot();else document.addEventListener('DOMContentLoaded',boot);
})();
</script>
</body>
</html>
